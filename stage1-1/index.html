<!DOCTYPE html>
<html lang="zh-Hant">

<meta charset="utf-8">

<title>高雄特殊教育學校國小部 115 學年度教材｜第一學習階段 第一學期</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📚</text></svg>">
<style>
/* 特教取向：大字、高對比、大按鈕（沿用各單元網站的設計原則） */
:root{
  --底:#faf6ee; --紙:#fffdf8; --框:#e2d8c4; --字:#33291c; --淡字:#6f6152;
  --主:#2f6f4f; --主淡:#eaf3ec;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--底); color:var(--字);
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  font-size:20px; line-height:1.7; -webkit-text-size-adjust:100%;
}

/* ── 頁首 ── */
.頁首{background:var(--主); color:#fff; padding:18px 20px 26px; text-align:center;}
.回學年度{display:inline-block; margin:0 0 14px; color:#fff; font-size:18px;
  font-weight:700; text-decoration:none; opacity:.9; padding:6px 14px;
  border:2px solid rgba(255,255,255,.6); border-radius:8px;}
.回學年度:hover{opacity:1; background:rgba(255,255,255,.15);}
.頁首 h1{margin:0; font-size:38px; letter-spacing:1px;}
.頁首 p{margin:8px 0 0; font-size:19px; opacity:.92;}

main{max-width:1180px; margin:0 auto; padding:26px 18px 90px;}

/* ── 麵包屑 ── */
.麵包屑{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin:0 0 20px; font-size:19px; color:var(--淡字); min-height:52px;}
.麵包屑 button{
  font:inherit; font-size:19px; cursor:pointer; color:var(--主); background:var(--主淡);
  border:2px solid var(--主); border-radius:10px; padding:8px 18px; font-weight:700;}
.麵包屑 button:hover{background:var(--主); color:#fff;}
.麵包屑 .目前{font-weight:700; color:var(--字);}

.區說明{margin:0 0 18px; font-size:19px; color:var(--淡字);}

/* ── 卡片格 ── */
.格{display:grid; gap:16px;}
.領域格{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));}
.單元格{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));}

.卡{
  background:var(--紙); border:2px solid var(--框); border-left:10px solid var(--主);
  border-radius:14px; padding:20px 22px; cursor:pointer; text-align:left;
  font:inherit; color:inherit; width:100%; display:block;
  box-shadow:0 2px 6px rgba(0,0,0,.05); transition:transform .12s, box-shadow .12s;}
.卡:hover{transform:translateY(-3px); box-shadow:0 8px 18px rgba(0,0,0,.12);}
.卡:focus-visible{outline:4px solid #f0a500; outline-offset:3px;}

.卡標{display:flex; align-items:center; gap:14px;}
.卡圖{font-size:44px; line-height:1;}
.卡名{font-size:29px; font-weight:800;}
.卡副{margin-top:10px; font-size:18px; color:var(--淡字);}

/* ── 單元卡：封面圖 ＋ 單元名（＋ 底部的使用說明書連結）── */
a.卡,.單元格 .卡{text-decoration:none; padding:0; overflow:hidden; border-left-width:2px;}
.單元格 .卡{display:flex; flex-direction:column;}
.主連結{text-decoration:none; color:inherit; display:block;}
/* 說明書連結：與主連結分開，才不會變成「點卡片卻開到說明書」 */
.說明連結{
  display:block; text-align:center; text-decoration:none; font-weight:700; font-size:19px;
  padding:12px 10px; border-top:2px solid var(--框); background:#00000006; margin-top:auto;}
.說明連結:hover{background:#00000012; text-decoration:underline;}
.說明連結:focus-visible{outline:4px solid #f0a500; outline-offset:-4px;}
/* 🔴 `height:auto` 不可以省：<img> 上有 width/height 屬性（給瀏覽器預留版位、
   避免載入時跳動），CSS 只寫 width:100% 的話那個 height 屬性會勝出，
   圖就被拉成 367×506（實測）而不是 3:2。要讓 aspect-ratio 決定高度，
   就必須把 height 交還給它。 */
.封面{display:block; width:100%; height:auto; aspect-ratio:3/2; object-fit:cover;
  background:var(--主淡); border-bottom:2px solid var(--框);}
/* 還沒生封面的單元：用領域色的純色底頂著，版面不會塌 */
.封面.無圖{display:flex; align-items:center; justify-content:center;
  font-size:56px; color:#fff; border-bottom:none;}
.單元名{font-size:27px; font-weight:800; line-height:1.35;
  padding:16px 20px; text-align:center; color:var(--字);}

.隱藏{display:none !important;}

/* ── 頁尾 ── */
.頁尾{max-width:1180px; margin:0 auto; padding:0 18px 40px; color:var(--淡字); font-size:17px;}
.提醒{background:#fff8e6; border:2px solid #f0d9a0; border-radius:12px; padding:14px 18px; margin-bottom:14px;}

/* ── 響應式 ── */
@media (max-width:1024px){
  body{font-size:19px;}
  .頁首 h1{font-size:32px;}
  .卡名{font-size:26px;} .單元名{font-size:24px;}
}
@media (max-width:600px){
  body{font-size:18px;}
  .頁首{padding:14px 14px 20px;} .頁首 h1{font-size:25px;} .頁首 p{font-size:17px;}
  .回學年度{font-size:15px; padding:5px 10px;}
  main{padding:18px 12px 70px;}
  .格{gap:12px;} .領域格,.單元格{grid-template-columns:1fr;}
  .卡{padding:16px 16px; border-left-width:8px;}
  .卡圖{font-size:36px;} .卡名{font-size:23px;} .單元名{font-size:22px;}
  .麵包屑{font-size:17px;} .麵包屑 button{font-size:17px; padding:7px 14px;}
}
@media (hover:none){ .卡:hover{transform:none;} }
</style>

const $ = (s) => document.querySelector(s);
const 領域區 = $("#領域區"), 單元區 = $("#單元區"),
      麵包屑 = $("#麵包屑"), 區說明 = $("#區說明");

const 總單元 = 資料.reduce((n, d) => n + d.單元.length, 0);
$("#頁尾統計").textContent =
  `共 ${資料.length} 個領域、${總單元} 個單元；本頁為純靜態頁面，離線也開得起來（連結需要網路）。`;

/* ── 第一層：領域 ── */
function 顯示領域() {
  領域區.classList.remove("隱藏");
  單元區.classList.add("隱藏");
  區說明.textContent = "請點選一個領域，看這個領域有哪些單元。";
  麵包屑.innerHTML = '<span class="目前">📚 全部領域</span>';
  領域區.innerHTML = "";
  資料.forEach((d, i) => {
    const b = document.createElement("button");
    b.className = "卡";
    b.style.borderLeftColor = d.色;
    b.innerHTML =
      `<span class="卡標"><span class="卡圖">${d.圖}</span>` +
      `<span class="卡名">${d.名}</span></span>` +
      `<span class="卡副">${d.單元.length} 個單元</span>`;
    b.onclick = () => 顯示單元(i);
    領域區.appendChild(b);
  });
  history.replaceState(null, "", "#");
  window.scrollTo(0, 0);
}

/* ── 第二層：某領域的單元 ── */
function 顯示單元(i) {
  const d = 資料[i];
  領域區.classList.add("隱藏");
  單元區.classList.remove("隱藏");
  // 老師 2026-08-15 指定：單元頁只留封面與單元名，說明文字也拿掉
  區說明.textContent = "";

  麵包屑.innerHTML = "";
  const 回 = document.createElement("button");
  回.textContent = "← 回全部領域";
  回.onclick = 顯示領域;
  麵包屑.appendChild(回);
  const 目前 = document.createElement("span");
  目前.className = "目前";
  目前.textContent = `${d.圖} ${d.名}`;
  麵包屑.appendChild(目前);

  單元區.innerHTML = "";
  d.單元.forEach((u) => {
    /* 🛑 卡片外框改成 <div> 不是 <a>：底下要放「使用說明書」第二個連結，
       而 <a> 裡面不可以再包 <a>（巢狀連結是無效 HTML，瀏覽器會自己拆掉）。
       主連結仍然涵蓋封面與單元名，點卡片的行為跟以前一樣。 */
    const 卡 = document.createElement("div");
    卡.className = "卡";
    卡.style.borderLeftColor = d.色;

    const a = document.createElement("a");
    a.className = "主連結";
    a.href = u.網址;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    /* 卡片主體只有兩樣東西：封面圖 ＋ 單元名（老師 2026-08-15 指定）
       🛑 單元名是 HTML 文字不是烤在圖上的——改名不必重生圖，也不會有中文錯字。 */
    const 封面 = u.封面
      ? `<img class="封面" src="${u.封面}" alt="${u.名}" width="760" height="506">`
      : `<div class="封面 無圖" style="background:${d.色}">${d.圖}</div>`;
    a.innerHTML = 封面 + `<div class="單元名">${u.名}</div>`;
    卡.appendChild(a);

    /* 使用說明書（老師 2026-08-16 指定：放在該領域的單元頁裡，跟單元擺在一起）
       同分頁開啟，看完按瀏覽器上一頁就回到這裡。沒有說明書就不長出這個按鈕。 */
    if (u.說明) {
      const s = document.createElement("a");
      s.className = "說明連結";
      s.href = u.說明;
      s.textContent = "📖 使用說明書";
      s.style.color = d.色;
      卡.appendChild(s);
    }
    單元區.appendChild(卡);
  });
  history.replaceState(null, "", "#" + encodeURIComponent(d.名));
  window.scrollTo(0, 0);
}

/* 網址帶 #領域名 時直接開那一層；瀏覽器上一頁也回得去 */
function 依網址顯示() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  const i = 資料.findIndex((d) => d.名 === h);
  if (i >= 0) 顯示單元(i); else 顯示領域();
}
window.addEventListener("hashchange", 依網址顯示);
依網址顯示();
