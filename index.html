<style>
/* 特教取向：大字、高對比、大按鈕（沿用各單元網站的設計原則） */
:root{
  --底:#faf6ee; --紙:#fffdf8; --框:#e2d8c4; --字:#33291c; --淡字:#6f6152;
  --主:#2f6f4f; --主淡:#eaf3ec;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--底); color:var(--字);
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  font-size:20px; line-height:1.7; -webkit-text-size-adjust:100%;
}

/* ── 頁首 ── */
.頁首{background:var(--主); color:#fff; padding:26px 20px; text-align:center;}
.頁首 h1{margin:0; font-size:38px; letter-spacing:1px;}
.頁首 p{margin:8px 0 0; font-size:19px; opacity:.92;}

main{max-width:1180px; margin:0 auto; padding:26px 18px 90px;}

/* ── 麵包屑 ── */
.麵包屑{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin:0 0 20px; font-size:19px; color:var(--淡字); min-height:52px;}
.麵包屑 button{
  font:inherit; font-size:19px; cursor:pointer; color:var(--主); background:var(--主淡);
  border:2px solid var(--主); border-radius:10px; padding:8px 18px; font-weight:700;}
.麵包屑 button:hover{background:var(--主); color:#fff;}
.麵包屑 .目前{font-weight:700; color:var(--字);}

.區說明{margin:0 0 18px; font-size:19px; color:var(--淡字);}

/* ── 卡片格 ── */
.格{display:grid; gap:16px;}
.領域格{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));}
.單元格{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));}

.卡{
  background:var(--紙); border:2px solid var(--框); border-left:10px solid var(--主);
  border-radius:14px; padding:20px 22px; cursor:pointer; text-align:left;
  font:inherit; color:inherit; width:100%; display:block;
  box-shadow:0 2px 6px rgba(0,0,0,.05); transition:transform .12s, box-shadow .12s;}
.卡:hover{transform:translateY(-3px); box-shadow:0 8px 18px rgba(0,0,0,.12);}
.卡:focus-visible{outline:4px solid #f0a500; outline-offset:3px;}

.卡標{display:flex; align-items:center; gap:14px;}
.卡圖{font-size:44px; line-height:1;}
.卡名{font-size:29px; font-weight:800;}
.卡副{margin-top:10px; font-size:18px; color:var(--淡字);}

/* 單元卡（外連） */
a.卡{text-decoration:none;}
.單元序{display:inline-block; min-width:96px; padding:3px 12px; margin-bottom:10px;
  background:var(--主淡); color:var(--主); border-radius:999px;
  font-size:17px; font-weight:800;}
.單元名{font-size:27px; font-weight:800; line-height:1.35;}
.單元資訊{margin-top:10px; font-size:17px; color:var(--淡字);}
.前往{margin-top:14px; font-size:19px; font-weight:800; color:var(--主);}

.隱藏{display:none !important;}

/* ── 頁尾 ── */
.頁尾{max-width:1180px; margin:0 auto; padding:0 18px 40px; color:var(--淡字); font-size:17px;}
.提醒{background:#fff8e6; border:2px solid #f0d9a0; border-radius:12px; padding:14px 18px; margin-bottom:14px;}

/* ── 響應式 ── */
@media (max-width:1024px){
  body{font-size:19px;}
  .頁首 h1{font-size:32px;}
  .卡名{font-size:26px;} .單元名{font-size:24px;}
}
@media (max-width:600px){
  body{font-size:18px;}
  .頁首{padding:20px 14px;} .頁首 h1{font-size:25px;} .頁首 p{font-size:17px;}
  main{padding:18px 12px 70px;}
  .格{gap:12px;} .領域格,.單元格{grid-template-columns:1fr;}
  .卡{padding:16px 16px; border-left-width:8px;}
  .卡圖{font-size:36px;} .卡名{font-size:23px;} .單元名{font-size:22px;}
  .麵包屑{font-size:17px;} .麵包屑 button{font-size:17px; padding:7px 14px;}
}
@media (hover:none){ .卡:hover{transform:none;} }
</style>
</head>

  資料.forEach((d, i) => {
    const b = document.createElement("button");
    b.className = "卡";
    b.style.borderLeftColor = d.色;
    b.innerHTML =
      `<span class="卡標"><span class="卡圖">${d.圖}</span>` +
      `<span class="卡名">${d.名}</span></span>` +
      `<span class="卡副">${d.單元.length} 個單元</span>`;
    b.onclick = () => 顯示單元(i);
    領域區.appendChild(b);
  });
  history.replaceState(null, "", "#");
  window.scrollTo(0, 0);
}

/* ── 第二層：某領域的單元 ── */
function 顯示單元(i) {
  const d = 資料[i];
  領域區.classList.add("隱藏");
  單元區.classList.remove("隱藏");
  區說明.textContent = "請點選一個單元，會開新分頁進入那個單元的教學網站。";

  麵包屑.innerHTML = "";
  const 回 = document.createElement("button");
  回.textContent = "← 回全部領域";
  回.onclick = 顯示領域;
  麵包屑.appendChild(回);
  const 目前 = document.createElement("span");
  目前.className = "目前";
  目前.textContent = `${d.圖} ${d.名}`;
  麵包屑.appendChild(目前);

  單元區.innerHTML = "";
  d.單元.forEach((u) => {
    const a = document.createElement("a");
    a.className = "卡";
    a.href = u.網址;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.style.borderLeftColor = d.色;
    const 資訊 = [u.週, `${u.頁} 頁`, `${u.題} 題評量`, `${u.卡} 張圖卡`]
      .filter(Boolean).join("　｜　");
    a.innerHTML =
      `<span class="單元序">第 ${u.序} 單元</span>` +
      `<div class="單元名">${u.名}</div>` +
      `<div class="單元資訊">${資訊}</div>` +
      `<div class="前往" style="color:${d.色}">前往教學網站 →</div>`;
    單元區.appendChild(a);
  });
  history.replaceState(null, "", "#" + encodeURIComponent(d.名));
  window.scrollTo(0, 0);
}

/* 網址帶 #領域名 時直接開那一層；瀏覽器上一頁也回得去 */
function 依網址顯示() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  const i = 資料.findIndex((d) => d.名 === h);
  if (i >= 0) 顯示單元(i); else 顯示領域();
}
window.addEventListener("hashchange", 依網址顯示);
依網址顯示();
</script>
